[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api calls to the Express backend
# Set VITE_API_URL in Netlify environment variables to your backend URL
[[redirects]]
  from = "/api/*"
  to = "https://amatir-website.onrender.com/api/:splat"
  status = 200
  force = true

# Prevent browser from caching API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

# SPA fallback — must come AFTER the /api redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
