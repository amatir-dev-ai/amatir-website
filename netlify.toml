[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api calls to the Express backend
# Set VITE_API_URL in Netlify environment variables to your backend URL
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.com/api/:splat"
  status = 200
  force = true

# SPA fallback — must come AFTER the /api redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
